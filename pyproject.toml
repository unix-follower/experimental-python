[project]
name = "experimental-python"
version = "1.0.0"
description = "Experiments with Python"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "pydot>=4.0.1",
    "pygraphviz>=2.0.1",
    "scipy>=1.18.0",
    "geopandas>=1.1.4",
    "numpy>=2.5.0",
    "pandas>=2.3.3",
    "seaborn>=0.13.2",
    "aiohttp>=3.14.0",
    "beautifulsoup4>=4.14.3",
    "scikit-learn>=1.8.0",
    "tensorflow",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
