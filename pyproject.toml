[project]
name = "experimental-dsa-python"
version = "1.0.0"
description = "Experiments with data-structures and algorithms (DSA) in Python"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "pydot>=4.0.1",
    "pygraphviz>=2.0.1",
    "scipy>=1.18.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
